<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0a1026"/>
      <stop offset="100%" stop-color="#03050b"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0,240,255,0)"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="rgba(0,240,255,0)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer border with neon pulse -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.4"/>
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="8 6"/>

  <!-- Corner targeting reticles -->
  <path d="M 60 110 L 60 60 L 110 60" fill="none" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
  <path d="M 452 110 L 452 60 L 402 60" fill="none" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
  <path d="M 60 402 L 60 452 L 110 452" fill="none" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
  <path d="M 452 402 L 452 452 L 402 452" fill="none" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>

  <!-- 3D Topographic Isometric Grid Backdrop -->
  <g opacity="0.15" stroke="#00f0ff" stroke-width="1.5">
    <line x1="80" y1="256" x2="432" y2="256"/>
    <line x1="256" y1="80" x2="256" y2="432"/>
    <circle cx="256" cy="256" r="180" fill="none"/>
    <circle cx="256" cy="256" r="130" fill="none"/>
  </g>

  <!-- Fingerprint Topographic Contour Ridges -->
  <g fill="none" stroke="url(#neonCyan)" stroke-width="8" stroke-linecap="round" filter="url(#glow)">
    <!-- Core / innermost whorls -->
    <path d="M 240 270 A 20 28 0 0 1 268 250 A 22 28 0 0 1 274 278" />
    <path d="M 230 280 A 32 40 0 0 1 280 240 A 34 42 0 0 1 290 286" />
    
    <!-- Mid whorl loops -->
    <path d="M 218 310 A 50 62 0 0 1 292 220 A 52 64 0 0 1 308 296" />
    <path d="M 204 330 A 70 85 0 0 1 306 195 A 72 88 0 0 1 326 312" />
    
    <!-- Outer ridges -->
    <path d="M 190 350 A 90 108 0 0 1 320 170 A 92 112 0 0 1 345 330" />
    <path d="M 174 365 A 110 132 0 0 1 334 145 A 112 136 0 0 1 364 350" />
    <path d="M 160 380 A 130 156 0 0 1 348 120 A 132 160 0 0 1 382 370" />
  </g>

  <!-- 3D Elevation Heightfield Accents -->
  <g fill="#00f0ff" opacity="0.8">
    <circle cx="256" cy="256" r="5" />
    <circle cx="290" cy="225" r="4" fill="#a855f7" />
    <circle cx="218" cy="265" r="4" fill="#00f0ff" />
    <circle cx="320" cy="290" r="4" fill="#38bdf8" />
  </g>

  <!-- Laser Scan Line -->
  <line x1="80" y1="240" x2="432" y2="240" stroke="url(#laserGrad)" stroke-width="4" filter="url(#glow)"/>
  <line x1="120" y1="240" x2="392" y2="240" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Topographic "3D" Badge -->
  <rect x="186" y="420" width="140" height="38" rx="8" fill="#00f0ff" fill-opacity="0.15" stroke="#00f0ff" stroke-width="2"/>
  <text x="256" y="446" fill="#00f0ff" font-family="system-ui, sans-serif" font-weight="800" font-size="20" text-anchor="middle" letter-spacing="4">3D SCAN</text>
</svg>
